<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geneva, Switzerland</title>
  <style>
    :root {
      --blue: #1f5f9f;
      --deep-blue: #123b63;
      --pale-blue: #eaf4ff;
      --white: #ffffff;
      --line: rgba(31, 95, 159, 0.26);
      --gold: #c99d36;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background-color: var(--white);
      background: linear-gradient(180deg, var(--white), var(--pale-blue));
      color: var(--deep-blue);
      font-family: Georgia, "Times New Roman", serif;
      padding: 24px;
    }

    .splash-wrap {
      width: min(680px, 100%);
      position: relative;
      isolation: isolate;
    }

    main {
      width: 100%;
      padding: 48px 36px;
      background-color: rgba(255, 255, 255, 0.84);
      background-image: url("images/waterbg-web.webp");
      background-position: center;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      border: 2px solid var(--blue);
      outline: 8px double rgba(31, 95, 159, 0.18);
      text-align: center;
      box-shadow: 0 18px 44px rgba(18, 59, 99, 0.15);
      position: relative;
      z-index: 2;
    }

    main > * { position: relative; z-index: 2; }

    main::before {
      content: "";
      position: absolute;
      z-index: 1;
      inset: 15% 12% 18%;
      border: 0;
      background: url("images/inner-waves.svg") center / cover no-repeat;
      transform: none;
      pointer-events: none;
    }

    main::after {
      content: "";
      width: 18px;
      height: 18px;
      position: absolute;
      border: 2px solid var(--gold);
      background: var(--white);
      transform: rotate(45deg);
    }

    main::after { bottom: -11px; left: 50%; }

    .deco-mark {
      width: 140px;
      height: 18px;
      margin: 0 auto 24px;
      border-top: 2px solid var(--blue);
      border-bottom: 2px solid var(--blue);
      position: relative;
    }

    .deco-mark::before,
    .deco-mark::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 12px;
      height: 12px;
      border: 2px solid var(--blue);
      background: var(--white);
      transform: translateY(-50%) rotate(45deg);
    }

    .deco-mark::before {
      left: 18px;
    }

    .deco-mark::after {
      right: 18px;
    }

    h1 {
      margin: 0;
      color: var(--blue);
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: clamp(2rem, 7vw, 4rem);
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    p {
      max-width: 540px;
      margin: 22px auto 32px;
      font-size: 1.15rem;
      line-height: 1.7;
    }

    button {
      min-height: 48px;
      padding: 0 28px;
      border: 2px solid var(--blue);
      background: var(--blue);
      color: var(--white);
      cursor: pointer;
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
      transition: background 160ms ease, color 160ms ease, transform 160ms ease;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(201, 157, 54, 0.7);
    }

    button:hover,
    button:focus-visible {
      background: var(--white);
      color: var(--blue);
      transform: translateY(-2px);
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
    }

    .game-link {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 28px;
      border: 2px solid var(--blue);
      color: var(--blue);
      background: var(--white);
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-weight: 700;
      text-decoration: none;
      text-transform: uppercase;
      transition: background 160ms ease, color 160ms ease, transform 160ms ease;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(201, 157, 54, 0.7);
    }

    .game-link:hover,
    .game-link:focus-visible {
      color: var(--white);
      background: var(--blue);
      transform: translateY(-2px);
    }

    button::before,
    button::after,
    .game-link::before,
    .game-link::after {
      content: "";
      width: 7px;
      height: 7px;
      position: absolute;
      border: 1px solid var(--gold);
      background: inherit;
      transform: rotate(45deg);
    }

    button::before,
    .game-link::before { top: 5px; left: 6px; }
    button::after,
    .game-link::after { right: 6px; bottom: 5px; }

    .music-toggle {
      min-height: 36px;
      padding: 0 16px;
      color: var(--deep-blue);
      background: var(--pale-blue);
      font-size: 0.78rem;
    }

    .hello-character {
      width: clamp(190px, 38vw, 300px);
      aspect-ratio: 1;
      position: absolute;
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      will-change: transform, opacity;
    }

    .hello-character img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      mix-blend-mode: multiply;
      filter: saturate(1.04) contrast(1.02);
    }

    .hello-character.edge-left,
    .hello-character.edge-right {
      top: 50%;
    }

    .hello-character.edge-left { left: 0; }
    .hello-character.edge-right { right: 0; }

    .hello-character.edge-top,
    .hello-character.edge-bottom {
      left: 50%;
    }

    .hello-character.edge-top { top: 0; }
    .hello-character.edge-bottom { bottom: 0; }

    .hello-character.show.edge-left { animation: hello-left 3s ease-in-out both; }
    .hello-character.show.edge-right { animation: hello-right 3s ease-in-out both; }
    .hello-character.show.edge-top { animation: hello-top 3s ease-in-out both; }
    .hello-character.show.edge-bottom { animation: hello-bottom 3s ease-in-out both; }

    @keyframes hello-left {
      0%, 100% { opacity: 0; transform: translate(34%, -50%); }
      14%, 78% { opacity: 1; transform: translate(-72%, -50%); }
    }

    @keyframes hello-right {
      0%, 100% { opacity: 0; transform: translate(-34%, -50%); }
      14%, 78% { opacity: 1; transform: translate(72%, -50%); }
    }

    @keyframes hello-top {
      0%, 100% { opacity: 0; transform: translate(-50%, 34%); }
      14%, 78% { opacity: 1; transform: translate(-50%, -30%); }
    }

    @keyframes hello-bottom {
      0%, 100% { opacity: 0; transform: translate(-50%, -34%); }
      14%, 78% { opacity: 1; transform: translate(-50%, 80%); }
    }

    .sr-only {
      width: 1px;
      height: 1px;
      position: absolute;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    @media (prefers-reduced-motion: reduce) {
      body { animation: none; }
    }
  </style>
</head>
<body>
  <div class="splash-wrap">
    <main>
      <div class="deco-mark" aria-hidden="true"></div>
      <h1>Geneva, Switzerland</h1>
      <p>
        Set beside Lake Geneva and framed by the Alps, Geneva is known for its
        international spirit, graceful lakeside promenades, and crisp Swiss elegance.
      </p>
      <div class="button-row">
        <button type="button" id="genevaButton">Say Hello</button>
        <a class="game-link" href="second.html">Play Hydrological Engineer</a>
        <button class="music-toggle" type="button" id="musicButton" aria-pressed="false">Music: Off</button>
      </div>
      <span class="sr-only" id="helloAnnouncement" aria-live="polite"></span>
    </main>
    <div class="hello-character" id="helloCharacter" role="img" aria-label="A friendly hydrological engineer character saying hello">
      <img src="images/character-web.webp" alt="">
    </div>
  </div>

  <script>
    let audioContext;
    let musicTimer;
    let musicStep = 0;
    let musicOn = false;

    function playTone(frequency, start, duration, type, volume) {
      if (!audioContext) return;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(volume, start + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      oscillator.connect(gain).connect(audioContext.destination);
      oscillator.start(start);
      oscillator.stop(start + duration + 0.05);
    }

    function scheduleMusicBar() {
      if (!audioContext || !musicOn) return;
      const chords = [[261.63, 329.63, 392.00], [220.00, 261.63, 329.63], [174.61, 220.00, 261.63], [196.00, 246.94, 293.66]];
      const chord = chords[musicStep % chords.length];
      const start = audioContext.currentTime + 0.04;
      chord.forEach((frequency) => playTone(frequency, start, 1.9, "sine", 0.035));
      playTone(chord[0] / 2, start, 1.7, "triangle", 0.045);
      musicStep += 1;
    }

    async function startMusic() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      if (!audioContext) audioContext = new AudioContextClass();
      if (audioContext.state === "suspended") await audioContext.resume();
      if (musicOn) return;
      musicOn = true;
      scheduleMusicBar();
      musicTimer = window.setInterval(scheduleMusicBar, 1900);
      document.getElementById("musicButton").textContent = "Music: On";
      document.getElementById("musicButton").setAttribute("aria-pressed", "true");
    }

    function stopMusic() {
      musicOn = false;
      window.clearInterval(musicTimer);
      document.getElementById("musicButton").textContent = "Music: Off";
      document.getElementById("musicButton").setAttribute("aria-pressed", "false");
    }

    function handleFirstPointer(event) {
      if (event.target.closest("#musicButton")) return;
      startMusic();
      document.removeEventListener("pointerdown", handleFirstPointer);
    }

    document.addEventListener("pointerdown", handleFirstPointer);
    document.getElementById("musicButton").addEventListener("click", function () {
      if (musicOn) stopMusic(); else startMusic();
    });
    const helloCharacter = document.getElementById("helloCharacter");
    const helloAnnouncement = document.getElementById("helloAnnouncement");
    const helloEdges = ["top", "right", "bottom", "left"];
    let lastHelloEdge = "";
    let helloTimer;

    document.getElementById("genevaButton").addEventListener("click", function () {
      startMusic();
      const choices = helloEdges.filter((edge) => edge !== lastHelloEdge);
      const edge = choices[Math.floor(Math.random() * choices.length)];
      lastHelloEdge = edge;
      window.clearTimeout(helloTimer);
      helloCharacter.className = `hello-character edge-${edge}`;
      void helloCharacter.offsetWidth;
      helloCharacter.classList.add("show");
      helloAnnouncement.textContent = "Hello Geneva";
      helloTimer = window.setTimeout(() => {
        helloCharacter.classList.remove("show");
        helloAnnouncement.textContent = "";
      }, 3000);
    });
  </script>
</body>
</html>
