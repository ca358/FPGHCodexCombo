<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" role="img" aria-labelledby="t d" data-city-centre="Paradeplatz" data-centre-lat="47.3697" data-centre-lon="8.5389" data-farthest-km="1.04" data-radius-km="2.1">
  <title id="t">Zurich east-up transit and visitor map</title>
  <desc id="d">Map centred on Paradeplatz and rotated ninety degrees clockwise, with Lake Zurich, the Limmat, the Sihl, major roads, moving trams, and a passenger boat.</desc>
  <defs>
    <linearGradient id="land" x2="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#dceefa"/></linearGradient>
    <pattern id="decoGrid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M14 0 28 14 14 28 0 14ZM14 6 22 14 14 22 6 14Z" fill="none" stroke="#1769aa" stroke-width=".7" opacity=".1"/><circle cx="14" cy="14" r="1.2" fill="#65b4df" opacity=".14"/></pattern>
    <pattern id="waterGeom" width="24" height="16" patternUnits="userSpaceOnUse"><rect width="24" height="16" fill="#69b6df"/><path d="M-6 9Q0 3 6 9T18 9T30 9M0 15 6 9M12 15l6-6" fill="none" stroke="#d9f3ff" stroke-width="1.4" opacity=".7"/></pattern>
    <style>.water[fill="none"]{stroke:url(#waterGeom)}.water:not([fill="none"]){fill:url(#waterGeom)}.compass-rose{transform:translate(450px,769px) scale(.525)}.compass-cartouche{transform:translate(450px,769px) scale(.7)}.place-labels text,.city-signature text,.map-labels text{paint-order:stroke;stroke:#f7fcff;stroke-width:4px;stroke-linejoin:round}</style>
    <g id="corner"><path d="M0 92V0h92"/></g>
  </defs>
  <rect width="900" height="820" fill="url(#land)"/><rect x="24" y="24" width="852" height="772" fill="url(#decoGrid)"/>

  <g class="rotated-geography" transform="translate(76.5 0) scale(.911111) translate(820 0) rotate(90)">
    <path class="water" d="M360 900C344 674 363 589 397 525 430 463 463 426 485 392 501 411 520 438 540 470 599 562 629 657 650 900Z" fill="#70bce4" stroke="#1769aa" stroke-width="7" stroke-linejoin="round"/>
    <path class="water" d="M490 395C490 291 499 167 520-90" fill="none" stroke="#65b4df" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="water" d="M250 900C301 649 322 521 300 400 279 280 349 177 512 145" fill="none" stroke="#83c6e7" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

    <g class="roads" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g data-road="Bahnhofstrasse"><path d="M390 0C405 80 414 150 421 210C425 300 430 389 420 520C300 590 150 640 0 680" stroke="#fff" stroke-width="15"/><path d="M390 0C405 80 414 150 421 210C425 300 430 389 420 520C300 590 150 640 0 680" stroke="#697f91" stroke-width="7"/></g>
      <g data-road="Limmatquai"><path d="M560 0C540 90 528 150 520 205C512 281 507 353 520 420C630 390 760 320 900 250" stroke="#fff" stroke-width="15"/><path d="M560 0C540 90 528 150 520 205C512 281 507 353 520 420C630 390 760 320 900 250" stroke="#697f91" stroke-width="7"/></g>
      <g data-road="Quaibruecke and Bellevue"><path d="M0 405C150 400 280 400 396 402C443 404 497 408 566 411" stroke="#fff" stroke-width="15"/><path d="M0 405C150 400 280 400 396 402C443 404 497 408 566 411" stroke="#697f91" stroke-width="7"/></g>
    </g>
    <g class="bridge" data-name="Quaibruecke"><path d="M468 406C486 407 505 408 524 409" fill="none" stroke="#3f86b8" stroke-width="13" stroke-linecap="round"/><path d="M468 406C486 407 505 408 524 409" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="6 5"/></g>
    <g class="traffic-car" aria-label="Animated road car">
      <path d="M-15-7H7l8 7v8h-30Z" fill="#fff" stroke="#0b4f80" stroke-width="2.5"/>
      <path d="M-8-5H5l5 5H-8Z" fill="#8ac9e9"/>
      <circle cx="-8" cy="9" r="3.5" fill="#0b4f80"/><circle cx="9" cy="9" r="3.5" fill="#0b4f80"/>
      <animateMotion id="zurichTrip1" begin="0s;zurichTrip3.end" dur="16s" rotate="auto" path="M390 0C405 80 414 150 421 210C425 300 430 389 420 520C300 590 150 640 0 680"/>
      <animateMotion id="zurichTrip2" begin="zurichTrip1.end" dur="16s" rotate="auto" path="M560 0C540 90 528 150 520 205C512 281 507 353 520 420C630 390 760 320 900 250"/>
      <animateMotion id="zurichTrip3" begin="zurichTrip2.end" dur="16s" rotate="auto" path="M0 405C150 400 280 400 396 402C443 404 497 408 566 411C550 415 535 418 520 420C630 390 760 320 900 250"/>
    </g>
    <g class="passenger-boat" aria-label="Lake Zurich passenger boat"><path d="M-18 0h36L10 12h-20Z" fill="#fff" stroke="#0b4f80" stroke-width="3"/><path d="M0 0v-18l15 18Z" fill="#65b4df" stroke="#0b4f80" stroke-width="2"/><animateMotion dur="18s" repeatCount="indefinite" rotate="auto" path="M495 475C510 590 529 730 548 875"/></g>
  </g>

  <g class="map-labels" fill="#0b4f80" font-family="Arial" font-weight="700"><text x="105" y="500" font-size="18">LAKE ZURICH / ZURICHSEE</text><text x="700" y="455" font-size="18">LIMMAT</text><text x="235" y="255" font-size="18">SIHL</text><text x="600" y="335" font-size="13">BAHNHOFSTRASSE</text><text x="555" y="225" font-size="13">LIMMATQUAI</text><text x="525" y="485" font-size="13">QUAIBRUECKE / BELLEVUE</text></g>
  <g class="place-labels" fill="#0b3558" font-family="Arial" font-size="13" font-weight="700"><text x="625" y="385">SWISS NATIONAL MUSEUM</text><text x="515" y="315">LINDENHOF</text><text x="410" y="405">FRAUMUNSTER</text><text x="525" y="445">GROSSMUNSTER</text><text x="585" y="530">KUNSTHAUS ZURICH</text><text x="350" y="565">ZURICH OPERA HOUSE</text><text x="215" y="335">BAHNHOF ENGE</text><text x="235" y="650">BOTANICAL GARDEN</text><text x="425" y="365">PARADEPLATZ / CITY CENTRE</text><text x="705" y="185">FIFA HEADQUARTERS</text></g>
  <g class="city-signature" transform="translate(615 610)" fill="none" stroke="#1769aa" stroke-width="4"><path d="M0 14h38c18 0 28-12 28-28M0 2h30c12 0 20-8 20-20"/><path d="M-4 24q12-9 24 0t24 0" stroke="#65b4df" stroke-width="2"/><text x="82" y="1" fill="#0b3558" stroke="none" font-family="Arial" font-size="14" font-weight="700">LAKE-TO-LIMMAT OUTLET</text><text x="82" y="20" fill="#1769aa" stroke="none" font-family="Arial" font-size="11" font-weight="700">ZURICH'S WATER GATEWAY</text></g>

  <g class="compass-rose" transform="translate(450 769) scale(.75)" stroke-linejoin="miter"><circle r="44" fill="#f7fcff" fill-opacity=".82" stroke="#1769aa" stroke-width="3"/><circle r="36" fill="none" stroke="#65b4df" stroke-width="2"/><circle r="15" fill="#fff" stroke="#0b4f80" stroke-width="2"/><g transform="rotate(90)" fill="#1769aa" stroke="#0b4f80" stroke-width="1.5"><path d="M0-41 8-14 0-20-8-14Z"/><path d="M41 0 14 8 20 0 14-8Z"/><path d="M0 41-8 14 0 20 8 14Z"/><path d="M-41 0-14-8-20 0-14 8Z"/><path d="M0-13 9 9 0 5-9 9Z" fill="#0b4f80"/></g><g fill="none" stroke="#1769aa" stroke-width="2"><path d="M-18-47h36M-18 47h36M-47-18v36M47-18v36"/></g><text x="55" y="5" text-anchor="middle" fill="#0b3558" stroke="none" font-family="Georgia,serif" font-size="16" font-weight="700">N</text></g>
  <g class="deco-frame" fill="none" stroke="#1769aa"><path d="M18 112V18h112M770 18h112v94M882 648v94H770M130 742H18v-94" stroke-width="8"/><use href="#corner" transform="translate(36 36)"/><use href="#corner" transform="translate(864 36) scale(-1 1)"/><use href="#corner" transform="translate(36 724) scale(1 -1)"/><use href="#corner" transform="translate(864 724) scale(-1 -1)"/></g>
  <g class="compass-cartouche" transform="translate(450 769)" fill="none" stroke="#1769aa" stroke-linejoin="miter"><path d="M-68-18v-22h20l9-9h78l9 9h20v22M68 18v22H48l-9 9h-78l-9-9h-20V18" stroke-width="3"/><path d="M-58-28h18l7-7h66l7 7h18M-58 28h18l7 7h66l7-7h18M-72-8h14M58-8h14M-72 8h14M58 8h14" stroke="#65b4df" stroke-width="2"/></g>
</svg>
